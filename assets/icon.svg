<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Same mark as the in-app rail logo (gui.rs `logo_mark`): an accent
       tile carrying a stack of containers above a waterline. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5894ff"/>
      <stop offset="1" stop-color="#2f64dc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#sheen)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- containers -->
  <g fill="#ffffff">
    <rect x="42" y="124" width="52" height="44" rx="8"/>
    <rect x="102" y="124" width="52" height="44" rx="8"/>
    <rect x="162" y="124" width="52" height="44" rx="8"/>
    <rect x="102" y="72" width="52" height="44" rx="8"/>
  </g>
  <!-- container doors -->
  <g stroke="#2f64dc" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <line x1="59.3" y1="134" x2="59.3" y2="158"/>
    <line x1="76.7" y1="134" x2="76.7" y2="158"/>
    <line x1="119.3" y1="134" x2="119.3" y2="158"/>
    <line x1="136.7" y1="134" x2="136.7" y2="158"/>
    <line x1="179.3" y1="134" x2="179.3" y2="158"/>
    <line x1="196.7" y1="134" x2="196.7" y2="158"/>
    <line x1="119.3" y1="82" x2="119.3" y2="106"/>
    <line x1="136.7" y1="82" x2="136.7" y2="106"/>
  </g>

  <!-- waterline -->
  <rect x="42" y="184" width="172" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
</svg>
