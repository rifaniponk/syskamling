<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Same mark as the in-app rail logo (gui.rs `logo_mark`): a geometric
       "S" whose spine is a heartbeat trace, set inside a gauge dial whose
       reading is the green "live" LED. For 16-32 px use icon-small.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2538"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <linearGradient id="ink" x1="60" y1="52" x2="196" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38cde6"/>
      <stop offset="0.55" stop-color="#5894ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="128" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5894ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5894ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <!-- tile, monitor grid, centre glow, rim -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#clip)" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <path d="M32,0V256M64,0V256M96,0V256M128,0V256M160,0V256M192,0V256M224,0V256"/>
    <path d="M0,32H256M0,64H256M0,96H256M0,128H256M0,160H256M0,192H256M0,224H256"/>
  </g>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- gauge dial: 270° sweep, lit up to the reading -->
  <g stroke-width="4" stroke-linecap="round">
    <g stroke="#5894ff">
      <line x1="55.9" y1="200.1" x2="64.4" y2="191.6" stroke-opacity="0.9"/>
      <line x1="39.7" y1="179.0" x2="45.7" y2="175.5" stroke-opacity="0.6"/>
      <line x1="29.5" y1="154.4" x2="36.2" y2="152.6" stroke-opacity="0.6"/>
      <line x1="26.0" y1="128.0" x2="38.0" y2="128.0" stroke-opacity="0.9"/>
      <line x1="29.5" y1="101.6" x2="36.2" y2="103.4" stroke-opacity="0.6"/>
      <line x1="39.7" y1="77.0" x2="45.7" y2="80.5" stroke-opacity="0.6"/>
      <line x1="55.9" y1="55.9" x2="64.4" y2="64.4" stroke-opacity="0.9"/>
      <line x1="77.0" y1="39.7" x2="80.5" y2="45.7" stroke-opacity="0.6"/>
      <line x1="101.6" y1="29.5" x2="103.4" y2="36.2" stroke-opacity="0.6"/>
      <line x1="128.0" y1="26.0" x2="128.0" y2="38.0" stroke-opacity="0.9"/>
      <line x1="154.4" y1="29.5" x2="152.6" y2="36.2" stroke-opacity="0.6"/>
      <line x1="179.0" y1="39.7" x2="175.5" y2="45.7" stroke-opacity="0.6"/>
    </g>
    <g stroke="#8fb4ff" stroke-opacity="0.18">
      <line x1="216.3" y1="77.0" x2="210.3" y2="80.5"/>
      <line x1="226.5" y1="101.6" x2="219.8" y2="103.4"/>
      <line x1="230.0" y1="128.0" x2="218.0" y2="128.0"/>
      <line x1="226.5" y1="154.4" x2="219.8" y2="152.6"/>
      <line x1="216.3" y1="179.0" x2="210.3" y2="175.5"/>
      <line x1="200.1" y1="200.1" x2="191.6" y2="191.6"/>
    </g>
  </g>

  <!-- the S: top bar, left bowl, pulse spine, right bowl, bottom bar -->
  <path d="M172,64 H100 A32,32 0 0 0 100,128 H110 L120,98 L134,158 L144,128 H156 A32,32 0 0 1 156,192 H84"
        fill="none" stroke="url(#ink)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- live LED, sitting on the dial as its reading -->
  <circle cx="200.1" cy="55.9" r="15" fill="#34d399" fill-opacity="0.22"/>
  <circle cx="200.1" cy="55.9" r="9" fill="#34d399"/>
</svg>
