[package]
name = "syskamling"
version = "0.1.0"
edition = "2021"
description = "SysKamling - developer system monitor for Linux: hardware, ports, and Docker containers"
license = "MIT"

[[bin]]
name = "syskamling"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client", "tokio", "http1"] }
tower-service = "0.3"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
